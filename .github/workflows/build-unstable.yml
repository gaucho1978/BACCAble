name: Build Beta Version
on:
  workflow_dispatch:
    inputs:
      TAG_NAME:
        description: "Beta tag (must not be a stable vX.Y.Z tag)"
        default: continuous
        required: true
      CFLAGS:
        description: "Optional preprocessor definitions (-DNAME or -DNAME=value)"
        default: ""
        required: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        env:
          TAG: ${{ inputs.TAG_NAME }}
        shell: bash
        run: |
          [[ "$TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || exit 1
          [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || exit 1
          echo "version=beta-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      extra_cppflags: ${{ inputs.CFLAGS }}
  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: baccable-*
          merge-multiple: true
          path: release
      - name: Prepare beta artifacts
        run: |
          cp release/baccable-C1.elf release/baccableC1_beta.elf
          cp release/baccable-C2.elf release/baccableC2_beta.elf
          cp release/baccable-BH.elf release/baccableBH_beta.elf
          if test -f release/baccable-CAN.elf; then
            cp release/baccable-CAN.elf release/baccableActAsCanable_beta.elf
          fi
      - name: Move beta tag after successful validation
        env:
          TAG: ${{ inputs.TAG_NAME }}
        run: |
          git tag -f "$TAG"
          git push origin "+refs/tags/$TAG:refs/tags/$TAG"
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          tag_name: ${{ inputs.TAG_NAME }}
          name: Beta Version ${{ needs.validate.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            release/*_beta.elf
            release/*.bin
            release/*.hex
