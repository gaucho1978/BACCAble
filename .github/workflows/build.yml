name: Build Stable Version
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      TAG_NAME:
        description: "Release tag (vX.Y.Z)"
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: tag
        env:
          REQUESTED_TAG: ${{ inputs.TAG_NAME }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF#refs/tags/}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.validate.outputs.tag }}
  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: baccable-*
          merge-multiple: true
          path: release
      - name: Preserve release ELF filenames
        run: |
          cp release/baccable-C1.elf release/baccableC1_stable.elf
          cp release/baccable-C2.elf release/baccableC2_stable.elf
          cp release/baccable-BH.elf release/baccableBH_stable.elf
          cp release/baccable-CAN.elf release/baccableActAsCanable_stable.elf
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Stable Version ${{ needs.validate.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            release/*_stable.elf
            release/*.bin
            release/*.hex
