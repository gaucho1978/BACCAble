name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
      extra_cppflags:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check conflict markers
        run: |
          if git grep -nE '^(<<<<<<< .+|=======$|>>>>>>> .+)' -- '*.c' '*.h' '*.s' '*.ld' '*.yml' '*.yaml' '*.md'; then
            exit 1
          fi
      - name: Host regression tests with ASan and UBSan
        run: make -C tests test
  firmware:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [C1, C2, BH, CAN]
    env:
      FLAVOR: ${{ matrix.flavor }}
      REQUESTED_VERSION: ${{ inputs.version }}
      EXTRA_CPPFLAGS: ${{ inputs.extra_cppflags }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate build inputs
        shell: bash
        run: |
          version="${REQUESTED_VERSION:-ci-$(git rev-parse --short HEAD)}"
          [[ "$version" =~ ^[a-zA-Z0-9._-]+$ ]] || exit 1
          for flag in $EXTRA_CPPFLAGS; do
            [[ "$flag" =~ ^-D[A-Za-z_][A-Za-z0-9_]*(=[A-Za-z0-9_.+-]+)?$ ]] || exit 1
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "15.3.Rel1"
      - name: Analyze and build
        if: matrix.flavor != 'CAN' || !contains(inputs.extra_cppflags, '-DDEBUG_MODE')
        working-directory: firmware/baccable
        run: |
          arm-none-eabi-gcc --version
          make lint
          make -j2 all
          test -s "build/$FLAVOR/baccable-$FLAVOR.bin"
          test -s "build/$FLAVOR/baccable-$FLAVOR.hex"
          arm-none-eabi-size "build/$FLAVOR/baccable-$FLAVOR.elf"
      - uses: actions/upload-artifact@v7
        if: matrix.flavor != 'CAN' || !contains(inputs.extra_cppflags, '-DDEBUG_MODE')
        with:
          name: baccable-${{ matrix.flavor }}
          path: |
            firmware/baccable/build/${{ matrix.flavor }}/*.elf
            firmware/baccable/build/${{ matrix.flavor }}/*.bin
            firmware/baccable/build/${{ matrix.flavor }}/*.hex
            firmware/baccable/build/${{ matrix.flavor }}/*.map
          if-no-files-found: error
